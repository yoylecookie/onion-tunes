<!DOCTYPE html>

<style>
    body {
       background-color:#0f0f0f; 
       margin-left:40px;
    }

    img {
       margin-top:40px;
    }

    .songlist { 
       background-color:#2f2f2f;
       padding:20px;
    }

    .songlist > button {
       width:100%;
       background-color:#1f1f1f;
       color:white;
    }

    .songlist > button:nth-of-type(even) {
       background-color:#2f2f2f;
    }

    .songlist > button:hover {
       background-color:#692952;
    }

    .songlist > button.active {
       background-color:#d854a8;
    }

    audio {
    }

    p {
       color:white;
       font-family:sans-serif;
    }

    h4 {
       color:white;
       font-family:sans-serif;
    }

    .download-btn {
       display:inline-block;
       padding:10px 20px;
       background-color:#d854a8;
       color:#ffffff;
       text-decoration:none;
       border-radius:5px;
       font-family:sans-serif;
       cursor:pointer;
       font-size:10px;
       border:none;
    }

    .download-btn:hover {
       background-color:#692952;
    }   

    .control {
       margin-top:30px;
    }
</style>

<img src="https://file.garden/Z_Zkhskjxktxt43S/Onion%20Tunes/portfolio/oonyintunesitelogo.svg" width="150px">

<script>
    function songes(button, a, b, c) {

        document.querySelectorAll('.songlist > button').forEach(btn => {
            btn.classList.remove('active');
        });

        button.classList.add('active');

        document.getElementById('player').src = a;
        document.getElementById('desc').innerText = b;
        document.getElementById('songname').innerText = c;
        document.getElementById('player').play();
        document.getElementById('down').href = a;
    }
</script>
